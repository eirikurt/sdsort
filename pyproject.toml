[project]
name = "sdsort"
version = "1.2.0"
description = "Sorts functions and class methods according to the step-down rule"
authors = [{ name = "Eiríkur Fannar Torfason", email = "eirikur.torfason@gmail.com" }]
requires-python = ">= 3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["click>=8.3.1"]

[project.urls]
Homepage = "https://github.com/eirikurt/sdsort"
Issues = "https://github.com/eirikurt/sdsort/issues"
Repository = "https://github.com/eirikurt/sdsort.git"

[project.scripts]
sdsort = "sdsort:main"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "basedpyright (>=1.39.10,<2.0.0)",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.ruff]
include = ["sdsort/**/*.py", "test/**/*.py"]
exclude = ["test/cases", "test/toml_cases"]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TC", "UP"]

[tool.basedpyright]
# basedpyright defaults to its "recommended" mode, which turns on a large set of
# opinionated extra rules. Pin "standard" so the gate stays equivalent to what
# pyright enforced; extra rules can be opted into deliberately, one at a time.
typeCheckingMode = "standard"
include = ["sdsort", "test"]
exclude = ["test/cases", "test/toml_cases", "test/repos"]

# Opted in from basedpyright's extra rules: the codebase is clean under these, and
# they catch annotations that silently decay into Any / Unknown.
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportMissingParameterType = "error"

[tool.uv]
required-version = ">=0.11.3,<0.12"

[tool.uv.build-backend]
module-name = "sdsort"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["repos"]
