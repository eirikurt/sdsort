- id: sdsort
  name: sdsort
  description: Sorts functions and class methods according to the step-down rule
  language: python
  entry: sdsort
  types: [python]
  # sdsort parallelises across worker processes internally (see --jobs). Without this,
  # pre-commit's own concurrency would run ~cpu_count invocations at once, each spawning up to
  # cpu_count workers of its own.
  require_serial: true
